    <!--
      Only the weights actually used, and loaded without blocking the first
      paint: the media="print" swap makes the browser fetch the stylesheet at
      low priority and apply it on load. font-display:swap then paints text in
      the fallback stack immediately, which is what keeps LCP off the
      font round-trip.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
    />
    <noscript>

                }

                "@type": "Question",
                "name": "Do I have to photograph my entire wardrobe?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Start with the 15 to 20 pieces you reach for most — that is enough to build real outfits from."
                }
              },
              {
                "@type": "Question",
                "name": "Is this for men as well?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. HOY works for men and women, and for both Indian and Western wardrobes."
                }
              },
              {
                "@type": "Question",
                "name": "Why only 20 people a day?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Because setting up a profile properly takes real attention. The counter resets at midnight IST."
                }
              }
            ]
          }
        ]
